# Nessie — Git-like catalog for Apache Iceberg tables
# Provides: branch/merge semantics, ACID multi-table commits, table versioning
# Backend: PostgreSQL (reuses existing cluster PostgreSQL for metadata)
# API: http://nessie.data.svc.cluster.local:19120/api/v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  namespace: data
  labels:
    app: nessie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nessie
  template:
    metadata:
      labels:
        app: nessie
    spec:
      containers:
        - name: nessie
          image: ghcr.io/projectnessie/nessie:0.80.0
          ports:
            - containerPort: 19120
          env:
            # Use PostgreSQL as version store (persists branch/commit history)
            - name: NESSIE_VERSION_STORE_TYPE
              value: JDBC
            - name: QUARKUS_DATASOURCE_DB_KIND
              value: postgresql
            - name: QUARKUS_DATASOURCE_USERNAME
              value: fraud_user
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: fraud_pass
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres-postgresql.data.svc.cluster.local:5432/claims_db
            - name: QUARKUS_HTTP_PORT
              value: "19120"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/config
              port: 19120
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/config
              port: 19120
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nessie
  namespace: data
spec:
  selector:
    app: nessie
  ports:
    - port: 19120
      targetPort: 19120
      name: api
