# MLflow — experiment tracking and model registry
# Production: backed by Linode Object Storage (artifact store) + PostgreSQL (metadata)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.11.0
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=/mlflow/db
            - --default-artifact-root=/mlflow/artifacts
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: mlflow-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml
spec:
  selector:
    app: mlflow
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500     # → http://<node-ip>:30500
