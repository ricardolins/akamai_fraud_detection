# In-cluster Docker registry (registry:2) — serves as the image registry for all demo services.
#
# Design:
#   - Pinned to the first LKE node (via nodeName injected by deploy.sh)
#   - Exposed via NodePort 32500 so deploy.sh can push from the developer machine
#   - Uses a PVC (10Gi) to persist images across pod restarts
#   - HTTP only — containerd on each node is configured to trust it via 00c-containerd-config.yaml
#
# deploy.sh replaces NODE_NAME_PLACEHOLDER before kubectl apply.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-storage
  namespace: tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: tools
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: registry
    spec:
      nodeName: NODE_NAME_PLACEHOLDER
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: registry-storage
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: tools
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 32500
      name: registry
