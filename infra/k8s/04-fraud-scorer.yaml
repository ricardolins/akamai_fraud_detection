# Fraud Scorer — ML inference API
# Production: BentoML serving XGBoost from MLflow registry
# Demo:       FastAPI + GBM trained on synthetic data at container startup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scorer
  namespace: ml
  labels:
    app: fraud-scorer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-scorer
  template:
    metadata:
      labels:
        app: fraud-scorer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      containers:
        - name: fraud-scorer
          image: REGISTRY/fraud-scorer:demo    # replaced by deploy.sh
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /tmp/model.pkl
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1.5Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-scorer
  namespace: ml
spec:
  selector:
    app: fraud-scorer
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800     # → http://<node-ip>:30800/docs
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-scorer-hpa
  namespace: ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-scorer
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
