# Medallion ETL jobs managed by the Spark Operator.
#
# silver-etl-scheduled  — runs daily at 02:00 UTC
#   Reads bronze JSONL from Object Storage, tokenizes PHI, writes Iceberg silver table via Nessie.
#
# gold-features-scheduled — runs weekly Sunday at 04:00 UTC
#   Reads silver Iceberg table, computes provider/member/claim feature aggregates, writes gold tables.
#
# Both jobs use the object-storage-credentials secret (created by deploy.sh from Terraform outputs).
# S3_ENDPOINT_PLACEHOLDER is replaced by deploy.sh via sed before kubectl apply.
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: silver-etl-scheduled
  namespace: processing
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: REGISTRY/spark-jobs:demo
    imagePullPolicy: Always
    mainApplicationFile: local:///app/silver_etl.py
    sparkVersion: "3.5.1"
    restartPolicy:
      type: OnFailure
      onFailureRetries: 2
      onFailureRetryInterval: 30
      onSubmissionFailureRetries: 3
      onSubmissionFailureRetryInterval: 20
    sparkConf:
      "spark.sql.extensions": >-
        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,
        org.projectnessie.spark.extensions.NessieSparkSessionExtensions
      "spark.sql.catalog.nessie": "org.apache.iceberg.spark.SparkCatalog"
      "spark.sql.catalog.nessie.catalog-impl": "org.apache.iceberg.nessie.NessieCatalog"
      "spark.sql.catalog.nessie.uri": "http://nessie.data.svc.cluster.local:19120/api/v1"
      "spark.sql.catalog.nessie.ref": "main"
      "spark.sql.catalog.nessie.warehouse": "s3a://fraud-datalake/warehouse"
      "spark.sql.catalog.nessie.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
      "spark.sql.catalog.nessie.s3.endpoint": "S3_ENDPOINT_PLACEHOLDER"
      "spark.sql.catalog.nessie.client.region": "br-gru-1"
      "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
      "spark.hadoop.fs.s3a.endpoint": "S3_ENDPOINT_PLACEHOLDER"
      "spark.hadoop.fs.s3a.path.style.access": "true"
      "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    driver:
      cores: 1
      memory: "1024m"
      serviceAccount: spark
      envFrom:
        - secretRef:
            name: object-storage-credentials
    executor:
      cores: 1
      instances: 1
      memory: "1024m"
      envFrom:
        - secretRef:
            name: object-storage-credentials
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: gold-features-scheduled
  namespace: processing
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: REGISTRY/spark-jobs:demo
    imagePullPolicy: Always
    mainApplicationFile: local:///app/gold_features.py
    sparkVersion: "3.5.1"
    restartPolicy:
      type: OnFailure
      onFailureRetries: 2
      onFailureRetryInterval: 30
      onSubmissionFailureRetries: 3
      onSubmissionFailureRetryInterval: 20
    sparkConf:
      "spark.sql.extensions": >-
        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,
        org.projectnessie.spark.extensions.NessieSparkSessionExtensions
      "spark.sql.catalog.nessie": "org.apache.iceberg.spark.SparkCatalog"
      "spark.sql.catalog.nessie.catalog-impl": "org.apache.iceberg.nessie.NessieCatalog"
      "spark.sql.catalog.nessie.uri": "http://nessie.data.svc.cluster.local:19120/api/v1"
      "spark.sql.catalog.nessie.ref": "main"
      "spark.sql.catalog.nessie.warehouse": "s3a://fraud-datalake/warehouse"
      "spark.sql.catalog.nessie.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
      "spark.sql.catalog.nessie.s3.endpoint": "S3_ENDPOINT_PLACEHOLDER"
      "spark.sql.catalog.nessie.client.region": "br-gru-1"
      "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
      "spark.hadoop.fs.s3a.endpoint": "S3_ENDPOINT_PLACEHOLDER"
      "spark.hadoop.fs.s3a.path.style.access": "true"
      "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
      "spark.sql.shuffle.partitions": "32"
    driver:
      cores: 1
      memory: "1024m"
      serviceAccount: spark
      envFrom:
        - secretRef:
            name: object-storage-credentials
    executor:
      cores: 1
      instances: 4
      memory: "2560m"
      envFrom:
        - secretRef:
            name: object-storage-credentials
