# DaemonSet — writes a containerd certs.d config on every LKE node to trust
# the in-cluster HTTP registry (NodePort 32500).
#
# containerd >= 1.5 reads /etc/containerd/certs.d/ on every image pull request,
# so no daemon restart or SIGHUP is needed — writing the file is sufficient.
#
# deploy.sh creates the registry-node-ip ConfigMap before applying this manifest.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: containerd-registry-config
  namespace: tools
  labels:
    app: containerd-registry-config
spec:
  selector:
    matchLabels:
      app: containerd-registry-config
  template:
    metadata:
      labels:
        app: containerd-registry-config
    spec:
      tolerations:
        - operator: Exists
      initContainers:
        - name: configure
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              REGISTRY_IP=$(cat /config/ip)
              REGISTRY_ADDR="${REGISTRY_IP}:32500"
              CERT_DIR="/host-etc/containerd/certs.d/${REGISTRY_ADDR}"

              echo "[containerd-config] Writing trust config for http://${REGISTRY_ADDR}"
              mkdir -p "${CERT_DIR}"

              printf 'server = "http://%s"\n\n[host."http://%s"]\n  capabilities = ["pull", "resolve"]\n  skip_verify = true\n' \
                "${REGISTRY_ADDR}" "${REGISTRY_ADDR}" > "${CERT_DIR}/hosts.toml"

              echo "[containerd-config] hosts.toml:"
              cat "${CERT_DIR}/hosts.toml"
              echo "[containerd-config] Done."
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
            - name: registry-ip
              mountPath: /config
      containers:
        - name: pause
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 86400; done"]
          resources:
            requests:
              cpu: "1m"
              memory: "8Mi"
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        - name: registry-ip
          configMap:
            name: registry-node-ip
